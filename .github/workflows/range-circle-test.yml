name: Build range-circle test
on:
  push:
    branches: [range-circle-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Apply range-circle prototype
        shell: pwsh
        run: |
          git apply --check Tools/RangeCircleTest/mob-range-circles.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch check failed' }
          git apply Tools/RangeCircleTest/mob-range-circles.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed' }
      - name: Configure Windows x64
        run: cmake -S . -B build/range-x64 -G "Visual Studio 17 2022" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DWOWCLIENT_OUTPUT_OVERRIDE=WowRangeTest64 -DWOWDECOMP_DISABLE_SIGNATURE_CHECKS=ON
      - name: Compile
        run: cmake --build build/range-x64 --config Release --target WowClient --parallel 4
      - name: Package instructions
        shell: pwsh
        run: |
          if (!(Test-Path bin/Win/WowRangeTest64.exe)) { throw 'Expected executable was not built' }
          Copy-Item Tools/RangeCircleTest/PLAY-TEST.txt bin/Win/PLAY-TEST.txt
          Add-Content bin/Win/PLAY-TEST.txt "`nCompatibility test: MPQ and interface signature checks are disabled using the upstream build option. This accepts modified files; it does not fix missing or damaged data."
      - name: Upload playable client files
        uses: actions/upload-artifact@v4
        with:
          name: WowRangeTest64
          path: bin/Win/
          if-no-files-found: error
          retention-days: 14
